name: Refresh Curiosity Dispatch headlines

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: curiosity-news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect fresh stories
        run: python update_feeds.py
      - name: Commit updated news only when stories are available
        run: |
          python - <<'PY'
          import json
          with open("news.json", encoding="utf-8") as f:
              data = json.load(f)
          count = len(data.get("stories", []))
          print(f"Collected {count} stories")
          if count == 0:
              raise SystemExit("No articles found; preserving existing feed")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Curiosity Dispatch stories"
            git push
          fi
